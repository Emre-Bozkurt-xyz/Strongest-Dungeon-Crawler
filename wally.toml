[package]
name = "emreb/strongest-dungeon-crawler"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# React 17 port. R4 in docs/tasks/ui-migration-plan.md assumes the React 17 hook surface --
# useSyncExternalStore does not exist here, which is why store hooks use useState + useEffect.
React = "jsdotlua/react@17.2.1"
ReactRoblox = "jsdotlua/react-roblox@17.2.1"
[server-dependencies]
# Session-locked player saves: one server owns a player's data at a time, with autosave and a flush
# on shutdown. See docs/planning/progression-direction.md, build order step 1.
ProfileStore = "lm-loleris/profilestore@1.0.3"
